# 加载在已有 Nginx 的 http 上下文。上游默认为同机原生 Nginx。
# 异机时改用后端内网地址，同机 Docker 共享网络时可用 app 和 livekit。
upstream chirp_app_backend {
    server 127.0.0.1:18115;
}
upstream chirp_livekit_backend {
    server 127.0.0.1:7880;
}

map $http_upgrade $chirp_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=chirp_authorization:10m rate=10r/s;

# 已有该域名的 server 时，将代理指令合并到原站点，沿用它的证书。
server {
    listen 443 ssl;
    server_name voice.example.com;
    ssl_certificate /path/to/chirp/fullchain.pem;
    ssl_certificate_key /path/to/chirp/privkey.pem;

    # 应用同时提供普通 HTTP、SSE 事件流、头像与附件上传。
    client_max_body_size 5m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # proxy_pass 只指定上游，保留 /rtc、所有子路径及原查询字符串。
    location ~ ^/rtc(?:/|$) {
        access_log off;
        proxy_pass http://chirp_livekit_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chirp_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~ ^/(twirp|internal)(?:/|$) { return 404; }

    location /authorization/v5/ {
        access_log off;
        limit_req zone=chirp_authorization burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://chirp_app_backend;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / {
        proxy_pass http://chirp_app_backend;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
